<!DOCTYPE html>
<html lang="en">
    <head>
        <title>%TITLE%</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="theme-color" content="#0b0b12">
        <meta name="description" content="EUC Rider - Lean Too Much. An electric unicycle arcade runner, playable in the browser.">
        <link rel="icon" href="assets/icon.jpg">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #0b0b12;
                /* Browsers add a tap-highlight and text selection on touch drags, which fights
                   the game's own touch steering. */
                -webkit-tap-highlight-color: transparent;
                -webkit-user-select: none;
                user-select: none;
                touch-action: none;
            }
            /* The canvas is auto-sized by the backend to the space this container reports,
               so the container - not the canvas - is what has to fill the viewport. */
            #canvas-container {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            #canvas {
                display: block;
                width: 100%;
                height: 100%;
                border: none;
                outline: none;
            }
            #boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #0b0b12;
                color: #e8e8f0;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                z-index: 10;
                transition: opacity 0.4s ease;
            }
            #boot.hidden { opacity: 0; pointer-events: none; }
            #boot h1 {
                margin: 0;
                font-size: clamp(22px, 5vw, 40px);
                letter-spacing: 0.12em;
                font-weight: 800;
                text-transform: uppercase;
            }
            #boot p { margin: 0; opacity: 0.55; font-size: 14px; letter-spacing: 0.08em; }
            #boot .bar {
                width: min(260px, 60vw);
                height: 3px;
                border-radius: 3px;
                background: #23232f;
                overflow: hidden;
            }
            #boot .bar span {
                display: block;
                width: 40%;
                height: 100%;
                border-radius: 3px;
                background: linear-gradient(90deg, #ff5a3c, #ffb03a);
                animation: slide 1.1s ease-in-out infinite;
            }
            @keyframes slide {
                0%   { transform: translateX(-100%); }
                100% { transform: translateX(250%); }
            }
            #tilt-permission {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                display: none;
                z-index: 20;
                padding: 14px 26px;
                border: none;
                border-radius: 999px;
                background: linear-gradient(90deg, #ff5a3c, #ffb03a);
                color: #1a1008;
                font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                letter-spacing: 0.04em;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
                cursor: pointer;
            }
            #tilt-permission.show { display: block; }
            #rotate-hint {
                position: fixed;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                z-index: 30;
                background: #0b0b12;
                color: #e8e8f0;
                font: 600 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                text-align: center;
                padding: 24px;
            }
            #rotate-hint.show { display: flex; }
            #rotate-hint .glyph {
                font-size: 46px;
                animation: tip 1.6s ease-in-out infinite;
            }
            @keyframes tip {
                0%, 45%, 100% { transform: rotate(0deg); }
                65%, 85%      { transform: rotate(-90deg); }
            }
            #rotate-hint small { display: block; opacity: 0.6; font-weight: 400; }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <div id="boot">
            <h1>EUC Rider</h1>
            <div class="bar"><span></span></div>
            <p>Loading&hellip;</p>
        </div>

        <button id="tilt-permission" type="button">Tilt to steer</button>

        <div id="rotate-hint">
            <div class="glyph">&#9634;</div>
            <div>Turn your phone sideways
                <small>The game is played in landscape</small>
            </div>
        </div>

        <!-- FreeType (asm.js) defines the global `Module` the font generator calls into.
             Nothing loads it at runtime, so it has to be a plain script tag ahead of the
             game - otherwise every TTF falls back to libGDX's built-in bitmap font. -->
        <script type="text/javascript" charset="utf-8" src="scripts/freetype.js"></script>

        <script>
            // The backend hands control to the game only once its own scripts are in;
            // fade the boot screen out on the first animation frame after that.
            function hideBootScreen() {
                var boot = document.getElementById("boot");
                if (boot) boot.classList.add("hidden");
            }
            // iOS only hands out motion readings if requestPermission() is called from inside a
            // real user gesture, which the game loop's own touch handling is not - it runs a
            // frame later, in requestAnimationFrame. Hence a plain DOM button. Every other
            // browser starts listening by itself, so the button never appears there.
            function setUpTiltPermission() {
                var button = document.getElementById("tilt-permission");
                if (!button) return;
                var needsPermission = typeof DeviceMotionEvent !== "undefined" &&
                    typeof DeviceMotionEvent.requestPermission === "function";
                if (!needsPermission) return;

                button.classList.add("show");
                button.addEventListener("click", function () {
                    // The game installs the listener itself; asking here is what makes the
                    // request happen inside the gesture.
                    DeviceMotionEvent.requestPermission().then(function (state) {
                        if (state === "granted" && window.__eucTiltEnable) {
                            window.__eucTiltEnable();
                        }
                        button.classList.remove("show");
                        lockLandscape();
                    }).catch(function () {
                        button.classList.remove("show");
                    });
                });
            }

            // Steering by tilt only makes sense if the screen stays put - otherwise the
            // browser reorients mid-corner and the controls swap under the player's hands.
            //
            // Locking is only allowed from fullscreen, and fullscreen only from a user gesture,
            // so both are asked for on the first touch. iOS supports neither lock nor this API
            // at all, which is what the rotate prompt below is for.
            var isTouch = (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;

            function lockLandscape() {
                var el = document.documentElement;
                var request = el.requestFullscreen || el.webkitRequestFullscreen;
                var done = request ? request.call(el) : Promise.reject();
                Promise.resolve(done).then(function () {
                    if (screen.orientation && screen.orientation.lock) {
                        return screen.orientation.lock("landscape");
                    }
                }).catch(function () {
                    // Refused or unsupported - the prompt handles it
                    updateRotateHint();
                });
            }

            function updateRotateHint() {
                var hint = document.getElementById("rotate-hint");
                if (!hint) return;
                var portrait = window.innerHeight > window.innerWidth;
                hint.classList.toggle("show", isTouch && portrait);
            }

            function setUpOrientation() {
                if (!isTouch) return;
                updateRotateHint();
                window.addEventListener("resize", updateRotateHint);
                window.addEventListener("orientationchange", updateRotateHint);
                document.addEventListener("touchend", function once() {
                    document.removeEventListener("touchend", once);
                    lockLandscape();
                }, { passive: true });
            }

            async function start() {
                %MODE%
                setTimeout(hideBootScreen, 400);
                setUpTiltPermission();
                setUpOrientation();
            }
            window.addEventListener("load", start);
        </script>
        %JS_SCRIPT%
    </body>
</html>
